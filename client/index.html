<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoDraw - Collaborative Drawing Board</title>
  <meta name="description" content="A premium real-time collaborative drawing canvas built with raw HTML5 and Vanilla JS.">
  
  <!-- Premium Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Header with System Status & Actions -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-dot"></span>
        <h1>CoDraw</h1>
      </div>
      <div class="header-actions">
        <button class="share-btn" id="btn-export" title="Export Canvas as PNG" style="background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-primary);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>Export PNG</span>
        </button>
        <button class="share-btn" id="btn-share" title="Copy Invite Link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span>Share Room</span>
        </button>
        <div class="status-indicator">
          <span class="status-dot disconnected" id="connection-status"></span>
          <span class="status-text">Disconnected</span>
          <div class="user-list-container">
            <span class="user-count-badge" id="user-count" style="display: none;">1 Online</span>
            <div class="user-list-dropdown" id="user-list-dropdown">
              <!-- Rendered dynamically -->
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Live Performance Metrics HUD -->
    <div class="performance-hud" id="perf-hud">
      <div class="metric-item">
        <span class="metric-dot fps"></span>
        <span class="metric-value" id="fps-val">60 FPS</span>
      </div>
      <div class="metric-divider"></div>
      <div class="metric-item">
        <span class="metric-dot ping"></span>
        <span class="metric-value" id="ping-val">-- ms</span>
      </div>
    </div>
    
    <!-- Workspace Main Display -->
    <main class="app-main">
      <div class="canvas-container" id="canvas-wrapper">
        <canvas id="canvas"></canvas>
        <!-- Peer Cursor overlays wrapper -->
        <div id="cursors-container"></div>
      </div>
      
      <!-- Hidden File Selector for Images -->
      <input type="file" id="image-loader" accept="image/*" style="display: none;">
      
      <!-- Floating Toolbar HUD -->
      <div class="toolbar-container" id="toolbar">
        <!-- Drawing Tools -->
        <div class="toolbar-group">
          <button class="tool-btn active" id="tool-brush" title="Brush">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.886a1 1 0 0 1-.95.682H2.946a1 1 0 0 0-.588 1.814l4.98 3.585a1 1 0 0 1 .364 1.118L5.8 22a1 1 0 0 0 1.542 1.117l4.9-3.51a1 1 0 0 1 .364-1.118L5.8 22a1 1 0 0 0 1.542 1.117l4.9-3.51a1 1 0 0 1 1.176 0l4.9 3.51A1 1 0 0 0 20 22l-1.902-5.915a1 1 0 0 1 .364-1.117l4.98-3.585a1 1 0 0 0-.588-1.814h-6.192a1 1 0 0 1-.95-.682L12 3z"/></svg>
          </button>
          <button class="tool-btn" id="tool-eraser" title="Eraser">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
          </button>
          <button class="tool-btn" id="tool-line" title="Line">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/></svg>
          </button>
          <button class="tool-btn" id="tool-rect" title="Rectangle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          </button>
          <button class="tool-btn" id="tool-circle" title="Circle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>
          </button>
          <button class="tool-btn" id="tool-text" title="Text Tool">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
          </button>
          <button class="tool-btn" id="tool-image" title="Insert Image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
        </div>

        <div class="divider"></div>

        <!-- Preset Color Swatches -->
        <div class="toolbar-group">
          <div class="color-palette">
            <button class="color-swatch active" style="background-color: #a855f7;" data-color="#a855f7" title="Purple"></button>
            <button class="color-swatch" style="background-color: #3b82f6;" data-color="#3b82f6" title="Blue"></button>
            <button class="color-swatch" style="background-color: #10b981;" data-color="#10b981" title="Green"></button>
            <button class="color-swatch" style="background-color: #ef4444;" data-color="#ef4444" title="Red"></button>
            <button class="color-swatch" style="background-color: #f59e0b;" data-color="#f59e0b" title="Amber"></button>
            <button class="color-swatch" style="background-color: #ffffff;" data-color="#ffffff" title="White"></button>
            
            <!-- Custom HTML5 Color Input Wrapper -->
            <div class="custom-color-wrapper">
              <input type="color" id="color-picker" value="#a855f7" title="Custom Color">
              <span class="custom-picker-icon">🎨</span>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Brush Thickness Slider -->
        <div class="toolbar-group slider-group">
          <span class="slider-label">Size</span>
          <input type="range" id="stroke-width" min="2" max="40" value="4" step="1">
          <span class="width-preview" id="width-val">4px</span>
        </div>

        <div class="divider"></div>

        <!-- Action Tools -->
        <div class="toolbar-group">
          <button class="action-btn" id="btn-undo" title="Undo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          </button>
          <button class="action-btn" id="btn-redo" title="Redo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
          </button>
          <button class="action-btn" id="btn-clear" title="Clear Canvas">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Loading scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="canvas.js"></script>
  <script src="websocket.js"></script>
  <script src="main.js"></script>
</body>
</html>
